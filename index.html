<script>
const groups = {nav:'Transport maritime', box:'Conteneurs', flow:'FCL et LCL', pallet:'Palettisation', logistics:'Logistique internationale'};
const course = [
 ['nav','Navires et conteneurisation','Cours maritime · p. 2',[
  ['Choisir le navire selon la marchandise','Pétrolier (tanker) : pétrole. Méthanier : gaz liquéfié (ici gaz naturel liquéfié). Chimiquier : produits chimiques. Céréalier : céréales. Vraquier : marchandises en vrac. Ro-Ro : véhicules et marchandises roulantes.'],
  ['Comprendre le Ro-Ro','Les véhicules roulent à bord par une rampe arrière ou latérale. Un ferry peut fonctionner ainsi. Certains navires disposent d’une grue ou d’un palan pour aider aux opérations.'],
  ['Pourquoi conteneuriser ?','La caisse en acier non motorisée, normalisée et réutilisable, facilite entreposage, manutention et transfert vers le camion. Moins de manipulations directes des colis réduit les risques de casse, perte ou vol et peut réduire les coûts logistiques.']
 ]],
 ['box','Types, dimensions et coûts','Cours maritime · p. 2–3',[
  ['Dry','Conteneur standard pour des marchandises générales qui ne requièrent pas une température contrôlée. Exemple : vêtements emballés.'],
  ['Reefer','Conteneur à température contrôlée capable de refroidir ou chauffer. Exemple : produits surgelés.'],
  ['Flat Rack et Open Top','Flat Rack : plateforme avec extrémités fixes ou rabattables selon le modèle, adaptée aux marchandises encombrantes ou hors gabarit. Open Top : ouverture par le dessus, utile pour charger à la verticale à la grue ou lorsque les portes sont inadaptées.'],
  ['Location ou détention','Une entreprise peut détenir ou louer le conteneur. Exemples de cours pour un 40 pieds au départ de Shanghai : Rotterdam 3 626 $, Los Angeles 7 514 $, New York 9 631 $. Exemples historiques non datés dans le support.'],
  ['Vérifier le matériel réel','Les chiffres ci-dessous sont ceux du support. La hauteur 2,89 m du High Cube soulève une ambiguïté entre hauteur intérieure et extérieure. Utiliser la fiche du matériel pour les cotes intérieures, l’ouverture des portes et la charge utile.']
 ]],
 ['flow','FCL, LCL et opérations','Cours maritime · p. 3–6',[
  ['FCL · Full Container Load','Le conteneur est utilisé en exclusivité dans le schéma du cours, même avec des espaces vides. Un seul lot au départ ne nécessite pas de groupage.'],
  ['LCL · Less than Container Load','Envoi partiel. Le chargeur remet des colis, palettes, caisses ou fûts. Le groupeur rassemble plusieurs expéditions dans un même conteneur.'],
  ['Lire dans l’ordre départ → arrivée','FCL/FCL : un expéditeur → un destinataire, sans groupage ni dégroupage. LCL/LCL : plusieurs → plusieurs, avec groupage et dégroupage. FCL/LCL : un → plusieurs, dégroupage à l’arrivée. LCL/FCL : plusieurs → un, groupage au départ.'],
  ['Après le port','Dans le schéma du cours, le dégroupage a lieu au terminal lorsque plusieurs destinataires doivent être servis. Un conteneur destiné à un client peut repartir par camion pour le post-acheminement. Le transitaire organise le transport et les formalités associées.']
 ]],
 ['pallet','Palettiser et empoter','Cours maritime · p. 4–6',[
  ['Palettes EURO et ISO','EURO : 1,20 × 0,80 m. ISO : 1,20 × 1,00 m. Une palette regroupe les colis en une unité de manutention normalisée et réutilisable. La charge admise dépend de la palette. Le gerbage est possible si le conditionnement le permet.'],
  ['Calculer en trois divisions','Pour chaque orientation permise, diviser la longueur, la largeur et la hauteur utile par la dimension correspondante du colis. Arrondir chaque quotient à l’entier inférieur. Multiplier les trois entiers, puis comparer les orientations.'],
  ['Reproduire les 32 colis du cours','Palette ISO et hauteur utile de 1,50 m. Colis orienté 0,30 × 0,50 × 0,35 m : ⌊1,20 ÷ 0,30⌋ = 4, ⌊1,00 ÷ 0,50⌋ = 2 et ⌊1,50 ÷ 0,35⌋ = 4. Total : 4 × 2 × 4 = 32.'],
  ['Planifier l’empotage','Contrôler l’état et la propreté du conteneur. Répartir la masse sur le plancher, placer le lourd au milieu et en bas, limiter les vides et vérifier le gerbage. Après la palette, refaire les contrôles à l’échelle du conteneur et des portes.']
 ]],
 ['logistics','Chapitre 1 · Organisation de la logistique','MOOI · chap. 1, p. 1–2',[
  ['Les trois flux','La logistique met le produit à disposition au bon endroit, au bon moment, au moindre coût compatible avec la qualité. La chaîne mobilise ressources, méthodes et outils du premier fournisseur au client final. Flux matériel : marchandises. Flux d’information : commandes et suivi. Flux financier : paiements et factures dans leur dimension financière.'],
  ['Amont, in situ et aval','Amont : activités avant production, comme l’approvisionnement. In situ : opérations au sein de l’entreprise, comme la gestion du stock et le contrôle des approvisionnements. Aval : activités après production, comme l’expédition des produits finis.'],
  ['Enjeux et sous-traitance','La logistique, liée aux achats dans les notes, contribue à la satisfaction, à l’image, à la rentabilité et à la différenciation. Externaliser permet de bénéficier d’un spécialiste et de se concentrer sur son métier. En contrepartie, il faut piloter la dépendance et la qualité du service.'],
  ['Acteurs et critères','Le transporteur effectue le transport. Le transitaire peut l’organiser et le groupeur réunit des lots LCL (rappels du cours maritime). Comparer coût, délai et sécurité. Les exemples cités couvrent notamment le maritime (MSC, Maersk), l’aérien (Air France), le ferroviaire (SNCF) et les opérateurs logistiques (GEODIS, DHL).']
 ]]
];
const lexicon = {
 'Chargeur':'Expéditeur qui confie sa marchandise au transporteur.',
 'Transporteur':'Acteur chargé d’effectuer le transport de la marchandise.',
 'Transitaire':'Professionnel qui organise le transport et les formalités associées.',
 'Groupeur':'Intermédiaire qui réunit plusieurs expéditions LCL.',
 'Groupage':'Réunion des lots au départ.',
 'Dégroupage':'Séparation des lots à destination.',
 'Empotage':'Chargement des marchandises dans le conteneur.',
 'Dépotage':'Déchargement des marchandises du conteneur.',
 'Gerbage':'Empilement de colis ou de palettes lorsque la charge le permet.',
 'Post-acheminement':'Transport depuis le port ou terminal d’arrivée jusqu’au lieu convenu.',
 'Charge utile':'Masse de marchandise admise, avec ses emballages et supports le cas échéant. La tare du conteneur se distingue de sa charge utile.',
 'FCL':'Full Container Load. Conteneur réservé en exclusivité dans le schéma du cours.',
 'LCL':'Less than Container Load. Expédition en groupage ou remise par lots à une extrémité du trajet.',
 'Ro-Ro':'Roll-on/Roll-off. Chargement roulant via une rampe.',
 'High Cube':'Variante de conteneur offrant davantage de hauteur que le standard.'
};
const dimensions = [['20 pieds','5,90 × 2,35 × 2,39','22 100'],['40 pieds','12,05 × 2,35 × 2,39','24 400'],['40 pieds High Cube','12,05 × 2,35 × 2,89','29 600']];
const bank = {};
function choice(id, topic, objective, prompt, answers) {
 bank[id] = {id, topic, objective, prompt, type:'choice', answers, format:'Choisis une réponse.', success:'Choisir la proposition qui respecte toutes les données.'};
}
function number(id,topic,objective,prompt,answer,explain) {
 bank[id] = {id,topic,objective,prompt,type:'number',answer,explain,format:'Saisis un entier seul, sans unité.',success:'Obtenir le bon entier avec les quotients tronqués ou la limite indiquée.'};
}
function short(id,topic,objective,prompt,accepted,explain) {
 bank[id] = {id,topic,objective,prompt,type:'short',accepted,explain,format:'Saisis le terme ou le sigle demandé.',success:'Identifier le terme exact. Les accents, espaces et majuscules sont tolérés.'};
}
function matching(id,topic,objective,prompt,pairs,explain) {
 bank[id] = {id,topic,objective,prompt,type:'match',pairs,explain,format:'Sélectionne un terme pour chaque ligne.',success:'Associer correctement toutes les lignes.'};
}
function written(id,topic,objective,prompt,checks,example) {
 bank[id] = {id,topic,objective,prompt,type:'written',checks,example,format:'Rédige 2 à 4 phrases. Compare ensuite ton raisonnement au corrigé.',success:'Les critères et leurs points figurent ci-dessous.'};
}

choice('ro','nav','Reconnaître le chargement roulant','Des camions doivent monter à bord par une rampe. Quel navire réserver ?',[
 ['Ro-Ro','Une rampe permet aux camions de rouler jusqu’à leur emplacement.'],
 ['Vraquier','Sa spécialité est le vrac, comme des minerais, et non les véhicules sur roues.'],
 ['Chimiquier','Il transporte des produits chimiques, pas des camions par rampe.']
]);
choice('std','nav','Expliquer un avantage','Quel effet la standardisation du conteneur permet-elle ?',[
 ['Moins de manipulations des colis entre navire et camion','On peut déplacer le conteneur comme une unité et réduire l’exposition des colis.'],
 ['La disparition des avaries','Des risques subsistent, notamment si la charge est mal calée.'],
 ['La suppression du post-acheminement','Il faut toujours organiser le trajet après le terminal si le lieu de livraison est ailleurs.']
]);
matching('ships','nav','Associer navires et cargaisons','Associe chaque cargaison au navire spécialisé du cours.',[
 ['Pétrole','Pétrolier'],['Gaz naturel liquéfié','Méthanier'],['Produits chimiques','Chimiquier'],['Céréales','Céréalier'],['Minerai en vrac','Vraquier']
],'Un céréalier est spécialisé dans les céréales. Un vraquier transporte du vrac, ici du minerai.');
choice('reef','box','Choisir selon la température','Un lot de produits doit rester à −18 °C pendant la traversée. Quel type sélectionner ?',[
 ['Reefer','Il permet de maintenir la température requise. Vérifier le réglage et la continuité de l’alimentation.'],
 ['Dry','Il ne régule pas la température.'],
 ['Open Top','Son ouverture facilite le chargement, sans assurer de froid.']
]);
choice('open','box','Choisir selon le mode de chargement','Une machine reste dans le gabarit intérieur d’un conteneur adapté, mais doit être descendue verticalement à la grue. Quel type répond au besoin ?',[
 ['Open Top','L’ouverture supérieure donne accès au chargement vertical.'],
 ['Dry','Le toit fixe empêche le chargement décrit.'],
 ['Reefer','Le froid ne résout pas l’accès par le dessus.']
]);
short('flat','box','Identifier un conteneur','Quelle plateforme conteneurisée à extrémités fixes ou rabattables peut convenir à une pièce très large hors gabarit ?', ['flat rack','flatrack'],'Un Flat Rack offre une plateforme adaptée à l’encombrement. Faire confirmer gabarit, arrimage et acceptation.');
choice('weight','box','Distinguer volume et masse','Dans un exercice, un 40 pieds standard a une charge utile de 24 400 kg. Un lot de 25 000 kg entre géométriquement. Que conclure ?',[
 ['Refuser cette configuration : dépassement de 600 kg','25 000 − 24 400 = 600 kg, avant tout poids de supports éventuellement omis.'],
 ['Accepter car le lot entre','La compatibilité géométrique ne valide pas la masse.'],
 ['Accepter si la marchandise est gerbable','Le gerbage n’augmente pas la charge utile.']
]);
choice('high','box','Lire la fiche du matériel','Une caisse mesure 2,65 m de haut. Le cours annonce 2,89 m pour le High Cube. Quelle vérification est indispensable avant réservation ?',[
 ['Mesurer ou confirmer la hauteur utile et l’ouverture des portes','Le repère du cours ne prouve ni le dégagement intérieur ni le passage à la porte.'],
 ['Vérifier uniquement la longueur','La hauteur est la contrainte déterminante ici.'],
 ['Réserver directement avec le chiffre du cours','La cote 2,89 m est ambiguë dans le tableau et doit être confirmée.']
]);
choice('rate','box','Interpréter un tarif du support','Que représente le montant de 3 626 $ pour Shanghai–Rotterdam en 40 pieds ?',[
 ['Un exemple du cours','Le support ne garantit ni la date, ni le périmètre exact, ni un tarif de réservation.'],
 ['Un tarif garanti aujourd’hui','Aucun devis actualisé n’est fourni.'],
 ['Une charge utile de 3 626 kg','Le symbole $ indique un montant.']
]);
choice('fcl','flow','Distinguer exclusivité et taux de remplissage','Un conteneur est réservé pour un seul expéditeur vers un seul client. Il est rempli à 60 %. Quel schéma ?',[
 ['FCL/FCL','Il n’y a ni groupage au départ ni séparation entre clients à l’arrivée.'],
 ['LCL/LCL','Le faible remplissage n’implique pas le partage du conteneur.'],
 ['FCL/LCL','Aucun dégroupage entre plusieurs destinataires n’est prévu.']
]);
choice('split','flow','Lire départ et arrivée','Une entreprise exporte un conteneur dédié avec des lots à séparer entre trois clients au terminal d’arrivée. Quel schéma ?',[
 ['FCL/LCL','Un seul expéditeur au départ, dégroupage à l’arrivée.'],
 ['LCL/FCL','Ce schéma inverse les opérations du cas.'],
 ['FCL/FCL','Il manquerait le dégroupage à destination.']
]);
choice('merge','flow','Identifier le groupage à l’origine','Trois fournisseurs partagent un conteneur à l’origine, remis entier à un acheteur au port d’arrivée. Quel schéma ?',[
 ['LCL/FCL','Groupage au départ, sans dégroupage entre plusieurs acheteurs à l’arrivée.'],
 ['FCL/LCL','Ce serait un seul expéditeur et plusieurs acheteurs.'],
 ['LCL/LCL','Il y aurait aussi dégroupage à l’arrivée.']
]);
choice('lcl','flow','Justifier le groupage','Un exportateur envoie deux palettes sèches sans exigence d’exclusivité. Le devis LCL tout compris est moins cher et respecte le délai. Quel choix ?',[
 ['LCL, en confirmant la protection et les manutentions prévues','Le partage répond au petit volume et aux données de prix et de délai.'],
 ['FCL, car deux palettes imposent une réservation entière','Aucune exclusivité n’est imposée par le cas.'],
 ['Reefer, parce qu’il y a groupage','Le contrôle de température et le mode de partage sont deux décisions distinctes.']
]);
choice('shared','flow','Repérer le groupage aux deux extrémités','Plusieurs expéditeurs partagent un conteneur, puis le terminal sépare les lots pour livrer plusieurs clients. Quel schéma ?',[
 ['LCL/LCL','Groupage à l’origine et dégroupage à destination.'],
 ['FCL/LCL','Le départ en FCL du schéma de cours suppose un seul lot au départ.'],
 ['LCL/FCL','Il manquerait le dégroupage entre les clients.']
]);
matching('terms','flow','Nommer les opérations','Associe chaque opération à son terme.',[
 ['Charger les marchandises dans le conteneur','Empotage'],['Vider le conteneur','Dépotage'],['Réunir les lots à l’origine','Groupage'],['Séparer les lots à destination','Dégroupage']

function scaled(raw) {
 const value = String(raw).trim().replace(',','.');
 if (!/^(?:\d+(?:\.\d{1,3})?|\.\d{1,3})$/.test(value)) return NaN;

 <p>Le volume disponible divisé par le volume d’un colis donne une borne théorique de 34. Le plan ci-dessus établit la possibilité géométrique de 33 dans les dimensions données. La faisabilité de 34 reste à démontrer. Confirme la masse, la résistance à l’écrasement, la stabilité, les jeux et le calage avant tout usage réel.</p></section>`;
}
function mixedPlan() {
 return [...Array.from({length:8},(_,i)=>[i%4*300,Math.floor(i/4)*350,300,350,false]),
  ...Array.from({length:3},(_,i)=>[i*350,700,350,300,true])];
}
function planDrawing(L,W,items,label) {
 return `<div class="plan" role="img" aria-label="${label}" style="aspect-ratio:${L}/${W}">${items.map(([x,y,l,w,rotated])=>`<span aria-hidden="true" class="parcel ${rotated?'rotated':''}" style="left:${x/L*100}%;top:${y/W*100}%;width:${l/L*100}%;height:${w/W*100}%"></span>`).join('')}</div>`;
}
function simulate(form) {
 const values=new FormData(form);
 const L=1200,W=values.get('palette')==='iso'?1000:800;
 const box=['l','w','h'].map(k=>scaled(values.get(k)));
 const height=scaled(values.get('height')), deduction=scaled(values.get('tareHeight'));
 const rawMass=values.get('mass').trim(),rawLimit=values.get('limit').trim();
 const weightGiven=Boolean(rawMass||rawLimit);
 const mass=weightGiven?scaled(rawMass):null,limit=weightGiven?scaled(rawLimit):null;
 const area=document.getElementById('sim-results'),error=document.getElementById('sim-error');
 error.hidden=true;
 area.innerHTML='';
 if(box.some(d=>!(d>=1 && d<=10000))||!(height>=1 && height<=10000 && deduction>=0 && deduction<height)) {
  error.textContent='Indique des dimensions entre 0,001 et 10 m. L’épaisseur doit être inférieure à la hauteur maximale.';
  error.hidden=false;
  return;
 }
 if(weightGiven && !(mass>0 && mass<=1000000000 && limit>0 && limit<=1000000000)) {
  error.textContent='Renseigne une masse par colis et une charge utile strictement positives (au maximum 1 000 000 kg).';
  error.hidden=false;
  return;
 }
 const upright=values.has('upright'),stackable=values.has('stack');
 const H=height-deduction;
 const results=calculate([L,W,H],box,upright,stackable,mass,limit);
 const best=results[0];
 const drawCount=best.counts[0]*best.counts[1];
 const axes=['L','l','h'];
 const quotient=(size,d,n,i)=>`${fr.format(size/1000)} ÷ ${fr.format(d/1000)} → ${n}${i===2&&!stackable&&n===1?' (1 couche)':''}`;
 const rows=results.map((r,i)=>[`${i===0?'<strong>':''}${r.d.map(d=>fr.format(d/1000)).join(' × ')}${i===0?'</strong>':''}`,...[L,W,H].map((space,j)=>quotient(space,r.d[j],r.counts[j],j)),r.count, ...(weightGiven?[r.usable]:[])]);
 const diagram=best.count && drawCount<=120 ? planDrawing(L,W,Array.from({length:drawCount},(_,i)=>[(i%best.counts[0])*best.d[0],Math.floor(i/best.counts[0])*best.d[1],best.d[0],best.d[1],false]),`Vue de dessus de la grille géométrique, ${best.counts[0]} par ${best.counts[1]} colis par couche.`):'';
 area.innerHTML=`<h2>Meilleur résultat uniforme · ${fr.format(best.usable)} colis</h2><p id="sim-best">${best.counts.join(' × ')} = <strong>${fr.format(best.count)} colis par géométrie</strong>. Hauteur utile : ${fr.format(H/1000)} m.</p>
 ${weightGiven?`<p>Limite de masse : ⌊${fr.format(limit/1000)} ÷ ${fr.format(mass/1000)}⌋ = ${fr.format(Math.floor(limit/mass))}. Le minimum est une capacité théorique. Vérifie la répartition des colis conservés.</p>`:'<p class="source">Masse et stabilité à vérifier. Aucun poids n’a été saisi.</p>'}
 ${!stackable?'<p>Le gerbage est désactivé : au maximum une couche.</p>':''}
 ${table('Orientations testées',['Orientation L × l × h (m)',...axes.map(a=>a+' · division → entier'),'Géométrie',...(weightGiven?['Avec masse']:[])],rows)}
 ${diagram}${diagram?'<p class="source">Vue de dessus d’une couche de la meilleure grille géométrique retenue. Les colis peuvent se toucher dans ce calcul.</p>':''}`;
}
function render() {
 clearInterval(timerId);
 const [hash,anchor]=location.hash.slice(1).split('/');
 const id=pages[hash]?hash:'accueil';
 const key=exercises[id];
 const round=key?roundFor(key):null;
 if(key==='exam' && round && !round.submitted && Date.now()>=round.deadline) submitRound(key,true);
 nav.innerHTML=Object.entries(pages).filter(([name])=>name!=='sources').map(([name,label])=>`<a href="#${name}" ${id===name?'aria-current="page"':''}>${label}</a>`).join('');
 nav.querySelector('[aria-current="page"]')?.scrollIntoView({block:'nearest',inline:'nearest'});
 const staticPages={accueil:dashboard,cours:lessons,atelier,express:expressPage,chapitre1:chapter,sources:sourcePage};
 const preserveAnchor=anchor && lastRoute===id && id==='cours' && document.getElementById(anchor);
 if(!preserveAnchor) main.innerHTML=(storageWarning?'<p class="note">Le navigateur limite le stockage local. La progression peut disparaître à la fermeture.</p>':'')+(key?exercisePage(key,pages[id]):staticPages[id]());
 lastRoute=id;
 if(anchor) {
  const target=document.getElementById(anchor);
  if(target) {
   if(target.tagName==='DETAILS') {target.open=true;target.querySelector('summary').focus({preventScroll:true});}
   else {target.tabIndex=-1;target.focus({preventScroll:true});}
   target.scrollIntoView({block:'start'});
  }
 } else {window.scrollTo(0,0);main.focus({preventScroll:true});}
 if(id==='atelier') simulate(document.getElementById('palette-form'));
 if(id==='partiel' && round && !round.submitted) {
  const update=()=>{
   const remaining=Math.max(0,Math.ceil((round.deadline-Date.now())/1000));
   const node=document.getElementById('timer');
   if(!node) return;
   node.textContent='Temps restant · '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');
   if(remaining===0){submitRound('exam',true);render();}
  };
  timerId=setInterval(update,250);
  update();
 }
}
function activeExercise() {
 return exercises[location.hash.slice(1).split('/')[0]];
}
function readRoundForm(form,round) {
 const data=new FormData(form);
 for(const [id] of round.ids) round.answers[id]=capture(data,bank[id]);
 save();
}
main.addEventListener('input',event=>{
 const form=event.target.closest('#round-form');
 if(form) readRoundForm(form,roundFor(activeExercise()));
});
main.addEventListener('change',event=>{
 const form=event.target.closest('#round-form');
 if(form) readRoundForm(form,roundFor(activeExercise()));
});
main.addEventListener('reset',event=>{
 if(event.target.id==='palette-form') setTimeout(()=>simulate(event.target),0);
});
main.addEventListener('submit',event=>{
 event.preventDefault();
 const form=event.target;
 if(form.id==='palette-form'){simulate(form);return;}
 if(form.id==='round-form'){
  const key=activeExercise(),round=roundFor(key);
  readRoundForm(form,round);
  if(key!=='exam' && !round.ids.some(([id])=>hasAnswer(bank[id],round.answers[id]))) {
   const error=document.getElementById('round-error');
   error.textContent='Réponds à au moins une question pour obtenir une correction.';
   error.hidden=false;
   return;
  }
  if(key==='exam' && round.ids.some(([id])=>!hasAnswer(bank[id],round.answers[id])) && !window.confirm('Certaines questions sont vides. Remettre la copie maintenant ?')) return;
  submitRound(key,key==='exam'&&Date.now()>=round.deadline);
  render();
  return;
 }
 if(form.dataset.practice){
  const q=bank[form.dataset.practice],raw=capture(new FormData(form),q),score=evaluate(q,raw);
  if(!hasAnswer(q,raw)){form.querySelector('.practice-feedback').innerHTML='<p class="error">Saisis une réponse avant de vérifier.</p>';return;}
  mark(q,score);
  form.querySelector('.practice-feedback').innerHTML=correction(q,raw,score);
  return;
 }
 if(form.dataset.self){
  const q=bank[form.dataset.self],round=roundFor(activeExercise());
  const selection=[...form.querySelectorAll('input:checked')];
  const score=selection.reduce((sum,input)=>sum+Number(input.value),0)/q.checks.reduce((sum,c)=>sum+c[1],0);
  round.manual[q.id]=score;
  round.criteria ??= {};
  round.criteria[q.id]=selection.map(input=>Number(input.dataset.index));
  mark(q,score);
  form.querySelector('.manual-status').textContent='Autoévaluation enregistrée.';
  document.getElementById('score').innerHTML=scoreLine(round);
 }
});
main.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 if(['start-round','retry-round','restart-round'].includes(button.id)) {
  const key=activeExercise();
  const previous=roundFor(key);
  if(button.id==='restart-round' && !window.confirm('Effacer les réponses de la série en cours et changer de série ?')) return;
  state.rounds[key]=buildRound(key,previous?previous.variant+1:0);
  save();render();
 }
 if(button.id==='reset' && window.confirm('Effacer la progression et les séries enregistrées sur cet appareil ?')){
  state={records:{},rounds:{}};save();render();
  document.getElementById('reset-note').textContent='Progression réinitialisée.';
 }
 if(button.id==='chapter-next'){
  chapterRound++;
  const node=document.getElementById('chapter-quiz');
  node.innerHTML=chapterQuiz();
  node.querySelector('input,select').focus();
 }
 if(button.dataset.flash==='reveal'){
  const back=document.getElementById('flash-back');
  back.hidden=!back.hidden;
  button.setAttribute('aria-expanded',String(!back.hidden));
  button.textContent=back.hidden?'Retourner la carte':'Masquer la définition';
 }
 if(['previous','next'].includes(button.dataset.flash)){
  const action=button.dataset.flash;
  flashIndex=(flashIndex+(action==='next'?1:-1)+flashcards.length)%flashcards.length;
  const node=document.getElementById('flash');
  node.innerHTML=currentFlash();
  node.querySelector('[data-flash="'+action+'"]').focus();
 }
});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();});
window.addEventListener('hashchange',render);
render();
</script>
</body>
